- title: Experience
  type: time_table
  contents:
    - title: Research Assistant — LiteCrackSeg
      institution: Monash University · Remote
      year: Sep 2025 – Present
      description:
        - Co-developed LiteCrackSeg, a 0.55M-parameter, 3.40 GFLOPs hybrid CNN–Transformer model for efficient crack segmentation on edge devices.
        - Designed the Dynamic Edge Enhancement Module (DEEM), fusing Sobel and Laplacian-of-Gaussian filters with dynamic convolutions to refine thin and fragmented crack boundaries.
        - Proposed Context-Aware Domain Adaptive Regularization (CoDAR) to penalize overconfident encoder channels, improving domain robustness and zero-shot cross-dataset generalization without inference-time overhead.
        - Achieved state-of-the-art F1 and mIoU on Crack500, DeepCrack, and TUT while maintaining real-time performance on NVIDIA Jetson Orin Nano (64 FPS, low energy per inference).
    - title: Machine Learning Researcher
      institution: Goldman Sachs · Amherst, MA
      year: Jan 2025 – Aug 2025
      description:
        - Developed a scalable RAG pipeline for SEC 10-K filings using Python, LangChain, and GPT OSS 120B, automating data ingestion, chunking, and multi-hop QA generation across enterprise-scale corpora.
        - Engineered an end-to-end ML pipeline for factoid extraction and answer grounding; implemented iterative LLM-based refinement achieving 94% precision in automatic evaluations.
        - Designed and deployed quality control workflows using LLM-as-a-judge scoring for fairness, reasoning traceability, and numeric fidelity across 1,000+ QA samples.
        - Benchmarked AI systems using precision, recall, nDCG, BLEU, and ROUGE-L to validate retrieval/generation robustness in high-stakes document QA systems.

